name: Verify NixOS Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Evaluate NixOS configuration
        run: nix eval .#nixosConfigurations.nixbox.config.system.build.toplevel.drvPath

      - name: Build NixOS configuration
        run: nix build .#nixosConfigurations.nixbox.config.system.build.toplevel --print-build-logs
